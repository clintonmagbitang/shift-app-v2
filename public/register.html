<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employee Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f6f8;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 22px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .note {
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Employee Registration</h1>

  <form id="form">
    <label>Full Name</label>
    <input required name="name" />

    <label>Email</label>
    <input type="email" required name="email" />

    <label>Password</label>
    <input type="password" required name="password" />

    <label>Phone</label>
    <input name="phone" />

    <label>Date Hired</label>
    <input type="date" required name="date_hired" />

    <label>Position</label>
    <input name="position" />

    <label>Employment Type</label>
    <select name="employment_type">
      <option value="full-time">Full-time</option>
      <option value="part-time">Part-time</option>
      <option value="contract">Contract</option>
    </select>

    <label>Street</label>
    <input name="street" />

    <label>Barangay</label>
    <input name="barangay" />

    <label>City</label>
    <input name="city" />

    <label>Province</label>
    <input name="province" />

    <label>Country</label>
    <input name="country" value="Philippines" />

    <label>Postal Code</label>
    <input name="postal_code" />

    <button type="submit" id="submitBtn">Register</button>
  </form>

  <div class="note">
    Employee ID will be auto-generated based on year hired.<br>
    After registering, an admin must approve your account before you can log in.
  </div>
</div>

<script>
  const form = document.getElementById("form");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    submitBtn.disabled = true;

    const raw = Object.fromEntries(new FormData(form).entries());
    // Simple trim for main fields
    const data = {
      ...raw,
      name: (raw.name || "").trim(),
      email: (raw.email || "").trim(),
      position: (raw.position || "").trim(),
      phone: (raw.phone || "").trim(),
      street: (raw.street || "").trim(),
      barangay: (raw.barangay || "").trim(),
      city: (raw.city || "").trim(),
      province: (raw.province || "").trim(),
      country: (raw.country || "").trim(),
      postal_code: (raw.postal_code || "").trim()
    };

    try {
      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await res.json().catch(() => ({}));

      if (!res.ok || result.error) {
        alert(result.error || "Registration failed. Please try again.");
        submitBtn.disabled = false;
        return;
      }

      alert(
        "Registration submitted.\n\n" +
        "An admin needs to approve your account first.\n" +
        "Once approved, you can log in from the login page."
      );
      location.href = "/login.html";
    } catch (err) {
      console.error(err);
      alert("Network error. Please try again.");
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
